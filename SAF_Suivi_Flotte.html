<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF – Suivi flotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#F4F6F8; --ink-2:#9AA7B4; --paper:#0A1420; --panel:#0D1B2A; --line:rgba(255,255,255,.09);
  --live:#3CC882; --ground:#5B9BE0; --stale:#6C7784; --lost:#E5484D; --signal:#F0C040; --gold:#C9A227;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--paper);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-top:env(safe-area-inset-top,0px)}
#map{height:100%;width:100%;background:var(--paper)}

header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
header h1{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;line-height:1;color:var(--signal)}
header .home{display:inline-block;margin-bottom:10px;font-size:13px;color:var(--gold);text-decoration:none}
header .home:hover{color:var(--signal)}
header p{margin:4px 0 0;color:var(--ink-2);font-size:13px}

#controls{display:flex;gap:8px;padding:10px 20px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
#controls label{font-size:13px;color:var(--ink-2)}
#controls select{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
#controls button{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}

#list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.ac{display:grid;grid-template-columns:6px 1fr;cursor:pointer;border-bottom:1px solid var(--line)}
.ac:hover,.ac.sel{background:rgba(255,255,255,.04)}
.ac .bar{background:var(--stale)}
.ac[data-st=live] .bar{background:var(--live)} .ac[data-st=ground] .bar{background:var(--ground)}
.ac[data-st=lost] .bar{background:var(--lost)}
.ac .body{padding:12px 16px 12px 14px}
.ac .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ac .reg{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1}
.ac .type{color:var(--ink-2);font-size:13px}
.ac .st{font-weight:600;font-size:14px;margin-top:4px}
.ac[data-st=live] .st{color:var(--live)} .ac[data-st=ground] .st{color:var(--ground)}
.ac[data-st=lost] .st{color:var(--lost)} .ac[data-st=none] .st,.ac[data-st=stale] .st{color:var(--stale)}
.ac dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px;margin:10px 0 0}
.ac dt{font-size:12px;color:var(--ink-2)} .ac dd{margin:0;font-family:var(--cond);font-weight:600;font-size:19px}
.ac dd small{font-family:var(--font);font-weight:400;font-size:12px;color:var(--ink-2)}
.ac .when{font-size:12px;color:var(--ink-2);margin-top:8px}

.ac .facts{font-size:13px;margin-top:8px;display:grid;gap:2px}
.ac .facts b{font-weight:600}
.ac .more{margin-top:8px;font-size:12px;color:var(--gold)}
.det{margin-top:12px;border-top:1px solid var(--line);padding-top:4px;font-size:13px;cursor:default}
.det h3{font-family:var(--cond);font-size:15px;font-weight:600;margin:12px 0 4px;color:var(--signal)}
.det p{margin:0 0 6px}
.det .muted{color:var(--ink-2)}
.det .note{font-size:11.5px;margin-top:6px}
.det table{width:100%;border-collapse:collapse}
.det td{padding:3px 0}
.det tr.sum td{padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.det .metar{font-family:var(--cond);font-size:13.5px;line-height:1.35}
footer{padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
footer .err{color:var(--lost)}

/* Session absente ou rôle non autorisé */
#gate{position:fixed;inset:0;display:none;place-items:center;align-content:center;gap:14px;background:var(--paper);z-index:2000;padding:20px;text-align:center}
#gate p{margin:0;max-width:420px;color:var(--ink-2)}
#gate a{color:var(--signal)}

/* Marqueurs */
.acm{position:relative}
.acm svg{position:absolute;left:-16px;top:-16px;width:32px;height:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.acm .lbl{position:absolute;left:18px;top:-11px;white-space:nowrap;font-family:var(--cond);font-weight:700;font-size:15px;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:0 5px;line-height:20px}
.acm.lost .lbl{background:var(--lost);color:#fff;border-color:var(--lost)}
.base{font-family:var(--cond);font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.leaflet-container{font-family:var(--font)}

@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:55% 45%}
  #map{grid-row:1} #side{grid-row:2;border-right:0;border-top:1px solid var(--line);padding-top:0}
  header{padding:10px 16px 8px} header h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <a class="home" href="index.html">← Accueil SAF International</a>
      <h1>Suivi flotte</h1>
      <p id="sub">Chargement…</p>
    </header>
    <div id="controls">
      <label for="win">Trace</label>
      <select id="win">
        <option value="1">1 h</option>
        <option value="3" selected>3 h</option>
        <option value="12">12 h</option>
        <option value="24">24 h</option>
      </select>
      <button id="fit" type="button">Toute la flotte</button>
      <button id="logout" type="button">Déconnexion</button>
    </div>
    <ul id="list"></ul>
    <footer id="foot">—</footer>
  </aside>
  <div id="map"></div>
</div>

<div id="gate" role="alert"><p id="gate-msg">Vérification de la session…</p><a href="index.html">Aller à l'accueil</a></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const CONFIG = {
  url: "https://qaqehmxoehcvzcojcqkm.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhcWVobXhvZWhjdnpjb2pjcWttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDE3NDMsImV4cCI6MjA5NjU3Nzc0M30.NQ8KjmF2E_cygwO5F7bNya7sy7_TkuVIBwYxQR6GR7Q",
  refreshMs: 30000,     // lecture Supabase (jamais NSE)
  liveMaxMin: 5,        // point plus récent que 5 min = en direct
  lostAfterMin: 45,     // en mouvement puis plus de point depuis 45 min = signal perdu
  movingSpeed: 5,
};
const BASES = [
  {name:"LFKA Albertville", lat:45.6276, lon:6.3297},
  {name:"LSGS Sion", lat:46.2196, lon:7.3268},
];
const COLORS = {live:"#3CC882", ground:"#5B9BE0", stale:"#6C7784", lost:"#E5484D", none:"#6C7784"};

// Même client et même stockage de session que index.html : pas de seconde connexion
const sb = supabase.createClient(CONFIG.url, CONFIG.key);

/* ---------- Carte ---------- */
const map = L.map("map", {zoomControl:true}).setView([45.9, 6.8], 8);
const layers = {
  "Topo (OpenTopoMap)": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"© OpenTopoMap, © OSM"}),
  "Plan (OSM)": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}),
  "swisstopo": L.tileLayer("https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg",{maxZoom:18,attribution:"© swisstopo"}),
  "Satellite (Esri)": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"© Esri"}),
};
layers["Topo (OpenTopoMap)"].addTo(map);
L.control.layers(layers, null, {position:"topright"}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
BASES.forEach(b => L.marker([b.lat,b.lon],{icon:L.divIcon({className:"base",html:"⌂ "+b.name,iconSize:null})}).addTo(map));

const markers = {}, trails = {};
let fleet = [], state = {}, selected = null, firstFit = true;

/* ---------- Utilitaires ---------- */
const normHeading = h => h == null ? null : ((h/100) % 360); // NSE : cap en centièmes de degré
const minsAgo = t => (Date.now() - new Date(t).getTime())/60000;
function ago(t){
  const m = minsAgo(t);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${Math.round(m)} min`;
  if (m < 48*60) return `il y a ${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,"0")}`;
  return `il y a ${Math.round(m/1440)} j`;
}
const hhmm = t => new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"UTC"})+" UTC";
function haversineKm(a,b){
  const R=6371, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
// Vitesse sol calculée entre les deux derniers points (si espacés de 20 s à 5 min)
function computedGs(p1,p0){
  if(!p1||!p0) return null;
  const dt=(new Date(p0.fix_time)-new Date(p1.fix_time))/3600000;
  if(dt<20/3600||dt>5/60) return null;
  return haversineKm(p1,p0)/dt;
}
function status(last){
  if(!last) return {k:"none",t:"Aucune position reçue"};
  const m=minsAgo(last.fix_time), moving=(last.speed??0)>CONFIG.movingSpeed;
  if(moving && m>CONFIG.lostAfterMin) return {k:"lost",t:`Signal perdu en vol – ${ago(last.fix_time)}`};
  if(moving) return {k:"live",t:m<=CONFIG.liveMaxMin?"En vol":"En vol – dernier point "+ago(last.fix_time)};
  if(m<=CONFIG.liveMaxMin) return {k:"ground",t:"Au sol, traceur actif"};
  return {k:"stale",t:"Au sol / traceur éteint"};
}
function arrowSvg(color,heading){
  const rot = heading==null?0:heading;
  return `<svg viewBox="0 0 32 32" style="transform:rotate(${rot}deg)"><circle cx="16" cy="16" r="13" fill="${color}" stroke="#fff" stroke-width="2"/>
  <path d="M16 6 L22 22 L16 18.5 L10 22 Z" fill="#fff"/></svg>`;
}
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Référentiel aérodromes (distance à vol d'oiseau, coordonnées approchées) ---------- */
// metar:true = aérodrome publiant un METAR
const AERODROMES = [
  {icao:"LFKA",name:"Albertville",lat:45.6276,lon:6.3297,base:true},
  {icao:"LSGS",name:"Sion",lat:46.2196,lon:7.3268,base:true,metar:true},
  {icao:"LFLB",name:"Chambéry Aix-les-Bains",lat:45.6381,lon:5.8802,metar:true},
  {icao:"LFLE",name:"Chambéry Challes",lat:45.5611,lon:5.9758},
  {icao:"LFLP",name:"Annecy",lat:45.9308,lon:6.1064,metar:true},
  {icao:"LSGG",name:"Genève",lat:46.2381,lon:6.1090,metar:true},
  {icao:"LFLS",name:"Grenoble Isère",lat:45.3629,lon:5.3294,metar:true},
  {icao:"LFLG",name:"Grenoble Le Versoud",lat:45.2192,lon:5.8497},
  {icao:"LFHM",name:"Megève",lat:45.8208,lon:6.6522},
  {icao:"LFLJ",name:"Courchevel",lat:45.3967,lon:6.6347},
  {icao:"LFKX",name:"Méribel",lat:45.4070,lon:6.5806},
  {icao:"LFHU",name:"L'Alpe d'Huez",lat:45.0883,lon:6.0847},
  {icao:"LSGB",name:"Bex",lat:46.2583,lon:6.9864},
  {icao:"LSGT",name:"Gruyères",lat:46.5942,lon:7.0944},
  {icao:"LFLY",name:"Lyon Bron",lat:45.7272,lon:4.9444,metar:true},
  {icao:"LFLL",name:"Lyon Saint-Exupéry",lat:45.7256,lon:5.0811,metar:true},
  {icao:"LFLU",name:"Valence Chabeuil",lat:44.9216,lon:4.9699,metar:true},
  {icao:"LIMW",name:"Aoste",lat:45.7385,lon:7.3687},
  {icao:"LIMF",name:"Turin Caselle",lat:45.2008,lon:7.6497,metar:true},
];
const BASE_RADIUS_KM = 2;
function bearingDeg(a,b){
  const r=x=>x*Math.PI/180, y=Math.sin(r(b.lon-a.lon))*Math.cos(r(b.lat));
  const x=Math.cos(r(a.lat))*Math.sin(r(b.lat))-Math.sin(r(a.lat))*Math.cos(r(b.lat))*Math.cos(r(b.lon-a.lon));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
const CARD=["N","NE","E","SE","S","SO","O","NO"];
function nearestAds(p,filter=()=>true,n=1){
  return AERODROMES.filter(filter).map(ad=>({ad,km:haversineKm(p,ad)})).sort((a,b)=>a.km-b.km).slice(0,n);
}
function placeLabel(p){
  const {ad,km}=nearestAds(p)[0];
  if(km<BASE_RADIUS_KM) return `${ad.icao} ${ad.name}`;
  return `${km<10?km.toFixed(1):Math.round(km)} km ${CARD[Math.round(bearingDeg(ad,p)/45)%8]} de ${ad.icao} ${ad.name}`;
}
const atBase = p => nearestAds(p,ad=>ad.base)[0].km < BASE_RADIUS_KM;
const isAir = p => (p.speed??0) > CONFIG.movingSpeed;
const hm = t => new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"UTC"});
function dur(min){ min=Math.max(0,Math.round(min)); return min<60?`${min} min`:`${Math.floor(min/60)} h ${String(min%60).padStart(2,"0")}`; }

/* ---------- Analyse des positions : vols, dernière pose, temps hors base ---------- */
// Les points NSE sont espacés (jusqu'à ~40 min) : les heures de décollage et d'atterrissage
// sont donc encadrées entre deux points, jamais connues exactement.
function analyze(pts){
  const flights=[]; let cur=null, lastLanding=null;
  for(let i=0;i<pts.length;i++){
    const p=pts[i], prev=pts[i-1]||null;
    if(isAir(p)){
      if(!cur){
        const fromGround = prev && !isAir(prev) && (new Date(p.fix_time)-new Date(prev.fix_time)) < 12*3600e3;
        cur={toFrom:fromGround?prev.fix_time:null, toTo:p.fix_time, toPlace:fromGround?prev:null, pts:fromGround?[prev,p]:[p]};
      } else cur.pts.push(p);
    } else if(cur){
      cur.ldFrom=cur.pts[cur.pts.length-1].fix_time; cur.ldTo=p.fix_time; cur.ldPlace=p; cur.pts.push(p);
      flights.push(cur); lastLanding={place:p,from:cur.ldFrom,to:p.fix_time}; cur=null;
    }
  }
  if(cur) flights.push(cur); // vol en cours
  for(const f of flights){
    f.km=f.pts.slice(1).reduce((s,p,i)=>s+haversineKm(f.pts[i],p),0);
    const a0=f.toFrom?new Date(f.toFrom):null, a1=new Date(f.toTo);
    const b0=f.ldFrom?new Date(f.ldFrom):null, b1=f.ldTo?new Date(f.ldTo):null;
    if(b1){ f.minMin=(b0-a1)/60000; f.maxMin=a0?(b1-a0)/60000:null; }
  }
  // Temps hors base
  let outside=null;
  const last=pts[pts.length-1];
  if(last && !atBase(last)){
    let i=pts.length-1; while(i>=0 && !atBase(pts[i])) i--;
    outside = i>=0 ? {since:pts[i+1].fix_time, leftFrom:pts[i]} : {since:null};
  }
  return {flights, lastLanding, outside};
}

/* ---------- Météo (à la demande, pour l'appareil sélectionné) ---------- */
const wxCache={}, metarCache={};
const WX_TTL=10*60e3;
async function ensureDetails(reg){
  const last=state[reg]?.last; if(!last) return;
  let changed=false;
  const w=wxCache[reg];
  if(!w || Date.now()-w.t>WX_TTL || haversineKm(w,last)>5){
    wxCache[reg]={t:Date.now(),lat:last.lat,lon:last.lon,loading:true};
    try{
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${last.lat.toFixed(4)}&longitude=${last.lon.toFixed(4)}`+
        `&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,cloud_cover,visibility&wind_speed_unit=kn&timezone=UTC`;
      const r=await fetch(u); wxCache[reg].data=(await r.json()).current;
    }catch(e){ wxCache[reg].err=String(e.message||e); }
    wxCache[reg].loading=false; changed=true;
  }
  const m=metarCache[reg];
  if(!m || Date.now()-m.t>WX_TTL || haversineKm(m,last)>5){
    const ids=nearestAds(last,ad=>ad.metar,2).map(x=>x.ad.icao);
    metarCache[reg]={t:Date.now(),lat:last.lat,lon:last.lon,ids,loading:true};
    try{
      const {data,error}=await sb.functions.invoke("fleet-metar",{body:{ids}});
      if(error) throw error; metarCache[reg].data=data.metars;
    }catch(e){ metarCache[reg].err=String(e.message||e); }
    metarCache[reg].loading=false; changed=true;
  }
  if(changed && selected===reg) render(lastPs);
}

function detailsHTML(reg){
  const s=state[reg], an=s.an, last=s.last;
  if(!last) return "";
  const near=nearestAds(last,()=>true,1)[0];
  const since24=Date.now()-24*3600e3;
  const fl=an.flights.filter(f=>new Date(f.ldTo||f.toTo)>=since24).reverse();
  let h=`<div class="det">`;
  h+=`<h3>Position</h3><p>${esc(placeLabel(last))}<br><span class="muted">Aérodrome le plus proche : ${esc(near.ad.icao)} ${esc(near.ad.name)}, ${near.km.toFixed(1)} km</span></p>`;
  h+=`<h3>Vols des dernières 24 h</h3>`;
  if(!fl.length) h+=`<p class="muted">Aucun vol enregistré sur la période.</p>`;
  else{
    h+=`<table><tbody>`;
    for(const f of fl){
      const to = f.toFrom ? `entre ${hm(f.toFrom)} et ${hm(f.toTo)}` : `avant ${hm(f.toTo)}`;
      const toPl = f.toPlace ? placeLabel(f.toPlace) : "lieu non enregistré";
      const ld = f.ldTo ? `entre ${hm(f.ldFrom)} et ${hm(f.ldTo)}` : "vol en cours";
      const ldPl = f.ldPlace ? placeLabel(f.ldPlace) : "—";
      const d = !f.ldTo ? "—" : f.maxMin!=null ? `${dur(f.minMin)} à ${dur(f.maxMin)}` : f.minMin>=5 ? `au moins ${dur(f.minMin)}` : "inconnue (décollage non enregistré)";
      h+=`<tr><td><b>Départ</b> ${esc(toPl)}<br><span class="muted">${to} UTC</span></td></tr>
          <tr><td><b>Arrivée</b> ${esc(ldPl)}<br><span class="muted">${ld}${f.ldTo?" UTC":""}</span></td></tr>
          <tr class="sum"><td>Durée ${d} · distance ≥ ${Math.round(f.km)} km</td></tr>`;
    }
    h+=`</tbody></table><p class="muted note">Heures encadrées entre deux points NSE ; la distance suit les seuls points reçus.</p>`;
  }
  const w=wxCache[reg];
  h+=`<h3>Météo au point</h3>`;
  if(!w||w.loading) h+=`<p class="muted">Chargement…</p>`;
  else if(w.err||!w.data) h+=`<p class="muted">Météo indisponible.</p>`;
  else{
    const c=w.data;
    const vis=c.visibility!=null?(c.visibility>=10000?"≥ 10 km":(c.visibility/1000).toFixed(1)+" km"):"–";
    h+=`<p>Vent ${String(Math.round(c.wind_direction_10m)).padStart(3,"0")}° / ${Math.round(c.wind_speed_10m)} kt`+
       `${c.wind_gusts_10m>c.wind_speed_10m+5?`, rafales ${Math.round(c.wind_gusts_10m)} kt`:""} · ${Math.round(c.temperature_2m)} °C · nébulosité ${c.cloud_cover} % · visibilité ${vis}`+
       `<br><span class="muted">Modèle Open-Meteo à ${hm(c.time+"Z")} UTC, pas une observation.</span></p>`;
  }
  const m=metarCache[reg];
  h+=`<h3>METAR les plus proches</h3>`;
  if(!m||m.loading) h+=`<p class="muted">Chargement…</p>`;
  else if(m.err||!m.data) h+=`<p class="muted">METAR indisponibles.</p>`;
  else for(const id of m.ids){
    const x=m.data[id], ad=AERODROMES.find(a=>a.icao===id);
    h+=`<p class="metar"><b>${id}</b> <span class="muted">${esc(ad.name)}, ${Math.round(haversineKm(last,ad))} km</span><br>${x?esc(x.raw):"<span class='muted'>pas de METAR récent</span>"}</p>`;
  }
  return h+`</div>`;
}

/* ---------- Données ---------- */
let lastPs=null;
async function load(){
  const hours=+document.getElementById("win").value;
  const winStart=Date.now()-hours*3600e3;
  const since=new Date(Math.min(winStart, Date.now()-36*3600e3)).toISOString(); // 36 h pour le journal
  try{
    const [ac,pos,ps]=await Promise.all([
      sb.from("fleet_aircraft").select("reg,type,imei,provider,active").order("reg"),
      sb.from("fleet_positions").select("reg,fix_time,lat,lon,alt_m,heading,speed").gte("fix_time",since).order("fix_time",{ascending:true}).limit(10000),
      sb.from("fleet_poll_state").select("last_poll,last_result").eq("id",1).maybeSingle(),
    ]);
    if(ac.error) throw ac.error; if(pos.error) throw pos.error;
    fleet=ac.data;
    const lasts=await Promise.all(fleet.map(a=>sb.from("fleet_positions").select("reg,fix_time,lat,lon,alt_m,heading,speed").eq("reg",a.reg).order("fix_time",{ascending:false}).limit(2)));
    state={};
    fleet.forEach((a,i)=>{
      const two=lasts[i].data||[];
      const all=pos.data.filter(p=>p.reg===a.reg);
      state[a.reg]={ac:a,last:two[0]||null,prev:two[1]||null,
        trail:all.filter(p=>new Date(p.fix_time)>=winStart), an:analyze(all)};
    });
    lastPs=ps.data;
    render(lastPs);
    if(selected) ensureDetails(selected);
  }catch(e){
    document.getElementById("foot").innerHTML=`<span class="err">Lecture impossible : ${esc(e.message||e)}. Nouvel essai dans ${CONFIG.refreshMs/1000} s.</span>`;
  }
}

function render(ps){
  const list=document.getElementById("list"); const scroll=list.scrollTop; list.innerHTML="";
  let nLive=0, nLost=0;
  const stackCount={}; // appareils posés au même endroit (~100 m) : étiquettes empilées

  for(const a of fleet){
    const s=state[a.reg], last=s.last, st=a.active?status(last):{k:"none",t:"Suivi non activé ("+a.provider+")"};
    if(st.k==="live") nLive++; if(st.k==="lost") nLost++;
    const hd=last?normHeading(last.heading):null;
    const gs=computedGs(s.prev,last);
    const an=s.an;
    let facts="";
    if(last){
      if(an.lastLanding) facts+=`<div>Dernière pose : <b>${esc(placeLabel(an.lastLanding.place))}</b>, vers ${hm(an.lastLanding.to)} UTC</div>`;
      if(atBase(last)) facts+=`<div>En base : <b>${esc(nearestAds(last,ad=>ad.base)[0].ad.icao)}</b></div>`;
      else if(an.outside?.since) facts+=`<div>Hors base depuis au moins <b>${dur(minsAgo(an.outside.since))}</b> (départ de ${esc(nearestAds(an.outside.leftFrom,ad=>ad.base)[0].ad.icao)})</div>`;
      else facts+=`<div>Hors base – départ non enregistré</div>`;
      const n24=an.flights.filter(f=>new Date(f.ldTo||f.toTo)>=Date.now()-24*3600e3).length;
      if(n24) facts+=`<div>${n24} vol${n24>1?"s":""} sur 24 h</div>`;
    }
    const li=document.createElement("li");
    li.className="ac"+(selected===a.reg?" sel":""); li.dataset.st=st.k; li.tabIndex=0;
    li.innerHTML=`<div class="bar"></div><div class="body">
      <div class="top"><span class="reg">${esc(a.reg)}</span><span class="type">${esc(a.type||"")}</span></div>
      <div class="st">${esc(st.t)}</div>
      ${last?`<dl>
        <div><dt>Altitude</dt><dd>${Math.round(last.alt_m*3.28084).toLocaleString("fr-FR")} <small>ft</small></dd></div>
        <div><dt>Cap</dt><dd>${hd==null?"–":String(Math.round(hd)%360).padStart(3,"0")+"°"}</dd></div>
        <div><dt>${gs!=null?"Vit. sol calc.":"Vitesse (brute)"}</dt><dd>${gs!=null?Math.round(gs/1.852)+' <small>kt</small>':esc(last.speed)}</dd></div>
      </dl>
      <div class="facts">${facts}</div>
      <div class="when">Dernier point ${hhmm(last.fix_time)} – ${ago(last.fix_time)}</div>
      ${selected===a.reg?detailsHTML(a.reg):`<div class="more">Afficher vols et météo</div>`}`:""}
    </div>`;
    const go=()=>{
      if(selected===a.reg){ selected=null; render(lastPs); return; }
      selected=a.reg; if(last) map.setView([last.lat,last.lon],Math.max(map.getZoom(),11));
      render(lastPs); ensureDetails(a.reg);
    };
    li.onclick=e=>{ if(e.target.closest(".det")) return; go(); };
    li.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};
    list.appendChild(li);

    // Marqueur
    if(last){
      const spot=last.lat.toFixed(3)+","+last.lon.toFixed(3);
      const idx=stackCount[spot]=(stackCount[spot]??-1)+1;
      const html=`<div class="acm ${st.k}">${arrowSvg(COLORS[st.k],hd)}<span class="lbl" style="top:${-11+idx*23}px">${esc(a.reg)}</span></div>`;
      const icon=L.divIcon({className:"",html,iconSize:[0,0]});
      if(markers[a.reg]) markers[a.reg].setLatLng([last.lat,last.lon]).setIcon(icon);
      else markers[a.reg]=L.marker([last.lat,last.lon],{icon,keyboard:false}).addTo(map).on("click",go);
      markers[a.reg].off("click").on("click",go);
      markers[a.reg].setZIndexOffset(st.k==="lost"?1000:st.k==="live"?500:0);
    }
    // Trace
    const pts=s.trail.map(p=>[p.lat,p.lon]);
    if(trails[a.reg]) trails[a.reg].setLatLngs(pts);
    else trails[a.reg]=L.polyline(pts,{weight:3,opacity:.85}).addTo(map);
    trails[a.reg].setStyle({color:COLORS[st.k],weight:selected===a.reg?5:3,opacity:selected&&selected!==a.reg?.35:.85});
  }
  list.scrollTop=scroll;
  document.getElementById("sub").textContent=
    `${fleet.length} appareils · ${nLive} en vol`+(nLost?` · ${nLost} signal perdu`:"");
  const f=document.getElementById("foot");
  f.textContent=`Affichage mis à jour ${new Date().toLocaleTimeString("fr-FR")}`+
    (ps?.last_poll?` · relais NSE ${ago(ps.last_poll)}`:"");
  if(ps?.last_poll && minsAgo(ps.last_poll)>5) f.innerHTML+=` <span class="err">Le relais ne tourne plus.</span>`;
  if(firstFit){ fitAll(); firstFit=false; }
}
function fitAll(){
  const ll=Object.values(state).filter(s=>s.last).map(s=>[s.last.lat,s.last.lon]);
  if(ll.length) map.fitBounds(L.latLngBounds(ll).pad(.3),{maxZoom:11});
}

/* ---------- Session (partagée avec l'accueil) ---------- */
let timer=null;
function gate(msg){ clearInterval(timer); document.getElementById("gate-msg").textContent=msg; document.getElementById("gate").style.display="grid"; }
async function boot(){
  const {data}=await sb.auth.getSession();
  const session=data.session;
  if(!session){ location.replace("index.html"); return; }
  // Rôle lu comme dans index.html ; l'accès réel est décidé par la RLS (admin, editor, reader)
  let role="reader";
  try{
    const r=await sb.from("user_roles").select("role").ilike("user_email",String(session.user.email||"").trim()).limit(1);
    if(r.data&&r.data[0]&&r.data[0].role) role=String(r.data[0].role).toLowerCase();
  }catch(e){}
  if(!["admin","editor","reader"].includes(role)){ gate("Le suivi flotte n'est pas ouvert à ce compte."); return; }
  load(); clearInterval(timer); timer=setInterval(load,CONFIG.refreshMs);
}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut(); location.replace("index.html");};
document.getElementById("win").onchange=load;
document.getElementById("fit").onclick=()=>{selected=null; fitAll(); load();};
sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT") location.replace("index.html"); });
boot();
</script>
