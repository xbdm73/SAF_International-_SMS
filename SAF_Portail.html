<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAF International — Portail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   CONFIGURATION — seul endroit à modifier pour ajouter un système.
   Voir le tableau SAF_SYSTEMS dans le <script> en bas de fichier.
   ================================================================ */
:root{
  --bg:#0f1418; --panel:#151b20; --card:#1a2128; --card-hover:#1f2830;
  --line:#26313a; --line-strong:#364552;
  --text:#e6ebef; --muted:#8b98a3; --faint:#5d6a74;
  --ok:#3fbf7f; --warn:#d9a53a; --off:#6b7780; --err:#e0605a;
  --focus:#7cb7ff;
  --font:"Archivo", "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f3f5f7; --panel:#ffffff; --card:#ffffff; --card-hover:#f8fafb;
  --line:#dde3e8; --line-strong:#c4ced6;
  --text:#17202a; --muted:#5b6872; --faint:#8a96a0;
  --ok:#21915a; --warn:#a87410; --off:#8a96a0; --err:#c2413b;
  --focus:#1f6fd1;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- Barre supérieure ---------- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;text-decoration:none}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.04em}
.crumb-sep{color:var(--faint);font-size:18px;font-weight:300}
.org{display:flex;align-items:center;gap:8px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;font-weight:500}
.org small{color:var(--muted);font-weight:400}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .dot{width:7px;height:7px;border-radius:50%;background:var(--off);flex:none}
.who.on .dot{background:var(--ok)}
.iconbtn{display:inline-grid;place-items:center;height:30px;min-width:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.iconbtn:hover{color:var(--text);border-color:var(--line-strong)}

/* ---------- Structure ---------- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100% - 52px)}
.side{border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.side h4{margin:14px 10px 6px;font-size:12px;font-weight:500;color:var(--faint)}
.side h4:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--muted)}
.side a:hover{background:var(--card);color:var(--text)}
.side a[aria-current="page"]{background:var(--card);color:var(--text);font-weight:500}
.side svg{width:16px;height:16px;flex:none}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--faint);line-height:1.6}

main{padding:32px clamp(16px,4vw,48px) 64px;max-width:1240px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted)}

.tools{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:360px}
.search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:34px;padding:0 34px 0 32px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.search input:focus{outline:none;border-color:var(--focus)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:inherit;font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{height:32px;width:34px;border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text)}
.seg svg{width:15px;height:15px}

/* ---------- Cartes système ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.sys{position:relative;display:flex;flex-direction:column;gap:14px;min-height:178px;padding:18px 18px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-decoration:none;transition:border-color .15s,background .15s}
.sys::before{content:"";position:absolute;left:-1px;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
a.sys:hover{border-color:var(--line-strong);background:var(--card-hover)}
.sys[aria-disabled="true"]{cursor:default}
.sys[aria-disabled="true"] .sys-name{color:var(--muted)}
.sys-top{display:flex;align-items:flex-start;gap:12px}
.sys-ico{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.sys-ico svg{width:19px;height:19px}
.sys-name{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.sys-path{margin:2px 0 0;font-size:12px;color:var(--faint);word-break:break-all}
.sys-desc{margin:0;color:var(--muted);font-size:13px;line-height:1.5;flex:1}
.sys-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--faint)}
.status{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:var(--off)}
.status[data-s="ok"] i{background:var(--ok)}
.status[data-s="ok"]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.status[data-s="err"] i{background:var(--err)}
.status[data-s="err"]{color:var(--err);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.status[data-s="pending"] i{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
.status[data-s="cfg"]{border-style:dashed}
@keyframes pulse{50%{opacity:.35}}

/* Vue liste */
.grid.list{grid-template-columns:1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid.list .sys{flex-direction:row;align-items:center;min-height:0;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px;gap:16px}
.grid.list .sys:last-child{border-bottom:0}
.grid.list .sys::before{top:10px;bottom:10px}
.grid.list .sys-top{flex:0 0 min(320px,40%);align-items:center}
.grid.list .sys-desc{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.list .sys-foot{flex:none;gap:16px}

.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.note{margin-top:28px;font-size:12px;color:var(--faint)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .who span{display:none}
  .org small{display:none}
  .grid.list .sys{flex-wrap:wrap}
  .grid.list .sys-top{flex-basis:100%}
  .grid.list .sys-desc{white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="#" aria-label="SAF International">
    <span class="brand-mark">SAF</span>
  </a>
  <span class="crumb-sep" aria-hidden="true">/</span>
  <div class="org">SAF International <small>CH.AOC.3052</small></div>
  <div class="spacer"></div>
  <div class="who" id="who" title=""><i class="dot"></i><span id="who-txt"></span></div>
  <button class="iconbtn" id="btn-lang" type="button" aria-label="Langue / Language">EN</button>
  <button class="iconbtn" id="btn-theme" type="button" aria-label="Thème">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="side" aria-label="Navigation">
    <h4 data-i18n="nav_org">Organisation</h4>
    <a href="#" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span data-i18n="nav_systems">Systèmes</span>
    </a>
    <a href="SAF_Report.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>
      <span data-i18n="nav_report">Faire un signalement</span>
    </a>
    <div class="side-foot">
      SAF International<br>SAF Hélicoptères<br>
      CH.AOC.3052<br>CH.CAMO.3052<br>
      <span data-i18n="bases">Sion · Albertville</span>
    </div>
  </nav>

  <main>
    <div class="head">
      <div>
        <h1 data-i18n="title">Systèmes</h1>
        <p class="sub" data-i18n="subtitle">Choisissez le système dans lequel vous voulez travailler.</p>
      </div>
    </div>

    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" data-i18n-ph="search" placeholder="Rechercher un système" aria-label="Rechercher">
        <kbd>/</kbd>
      </label>
      <div class="seg" role="group" aria-label="Affichage">
        <button type="button" id="v-grid" aria-pressed="true" title="Grille">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button type="button" id="v-list" aria-pressed="false" title="Liste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        </button>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <p class="note" data-i18n="note">Chaque système gère sa propre connexion et ses droits d'accès.</p>
  </main>
</div>

<script>
/* ================================================================
   SYSTÈMES — url vide = carte « À configurer » non cliquable.
   url relative (ex. 'index.html') = fichier du même dépôt GitHub.
   url absolue (https://…) = application hébergée ailleurs.
   ================================================================ */
const SAF_SYSTEMS = [
  { id:'sms', color:'#e3a33b', icon:'shield',
    name:{fr:'Safety Management System', en:'Safety Management System'},
    desc:{fr:'Registre des risques, journal des occurrences, Compliance Monitoring et appendices OMM.',
          en:'Risk register, occurrence log, compliance monitoring and OMM appendices.'},
    url:'index.html' },
  { id:'training', color:'#5b9cf0', icon:'cap',
    name:{fr:'Crew Training', en:'Crew Training'},
    desc:{fr:'Suivi des formations, contrôles et validités des équipages.',
          en:'Crew training, checks and currency tracking.'},
    url:'https://saf-international-crew-training.netlify.app/' },
  { id:'roster', color:'#d9773a', icon:'hook',
    name:{fr:'Roster levage', en:'HESLO roster'},
    desc:{fr:'Planning des équipages et des appareils pour les chantiers héliportés.',
          en:'Crew and aircraft planning for external-load work.'},
    url:'' },
  { id:'fire', color:'#e05a4f', icon:'flame',
    name:{fr:'Lutte incendie', en:'Firefighting'},
    desc:{fr:'Missions feux de forêt, Cascade Bucket et opérations de nuit NVIS.',
          en:'Wildfire missions, Cascade Bucket and NVIS night operations.'},
    url:'' },
  { id:'fleet', color:'#3fb5a6', icon:'pin',
    name:{fr:'Suivi flotte', en:'Fleet tracking'},
    desc:{fr:'Position en temps réel de HB-ZIP, HB-ZKN et F-HRTS.',
          en:'Live position of HB-ZIP, HB-ZKN and F-HRTS.'},
    url:'SAF_Suivi_Flotte.html' }
];

/* Projet Supabase dont la session est lue (lecture seule, aucun appel réseau) */
const SAF_SUPABASE_REF = 'qaqehmxoehcvzcojcqkm';

const ICONS = {
  shield:'<path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/>',
  cap:'<path d="M2 9l10-5 10 5-10 5L2 9z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>',
  hook:'<path d="M12 2v9"/><path d="M8 6h8"/><path d="M12 11a4 4 0 1 1-4 4"/>',
  flame:'<path d="M12 22c4 0 7-2.8 7-7 0-4.5-4-7-4-11-3 2-5 5-5 8-1-1-2-2-2-4-2 2-3 4.5-3 7 0 4.2 3 7 7 7z"/>',
  pin:'<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>'
};

const T = {
  fr:{ nav_org:'Organisation', nav_systems:'Systèmes', nav_report:'Faire un signalement', bases:'Sion · Albertville',
       title:'Systèmes', subtitle:'Choisissez le système dans lequel vous voulez travailler.',
       search:'Rechercher un système', note:'Chaque système gère sa propre connexion et ses droits d\u2019accès.',
       s_ok:'En ligne', s_err:'Injoignable', s_pending:'Vérification', s_cfg:'À configurer', s_ext:'Externe',
       opened:'Ouvert', never:'Jamais ouvert', notcfg:'Adresse non renseignée',
       empty:'Aucun système ne correspond à « {q} ».',
       anon:'Non connecté', session:'Session SMS', expired:'Session SMS expirée',
       ago_now:'à l\u2019instant', ago_m:'il y a {n} min', ago_h:'il y a {n} h', ago_d:'il y a {n} j' },
  en:{ nav_org:'Organisation', nav_systems:'Systems', nav_report:'Report an occurrence', bases:'Sion · Albertville',
       title:'Systems', subtitle:'Choose the system you want to work in.',
       search:'Search systems', note:'Each system handles its own sign-in and access rights.',
       s_ok:'Online', s_err:'Unreachable', s_pending:'Checking', s_cfg:'Not configured', s_ext:'External',
       opened:'Opened', never:'Never opened', notcfg:'No address set',
       empty:'No system matches \u201c{q}\u201d.',
       anon:'Not signed in', session:'SMS session', expired:'SMS session expired',
       ago_now:'just now', ago_m:'{n} min ago', ago_h:'{n} h ago', ago_d:'{n} d ago' }
};

/* ---------- stockage protégé ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let lang  = store.get('saf_portal_lang','fr');
let view  = store.get('saf_portal_view','grid');
let theme = store.get('saf_portal_theme', null);
const health = {};               // id -> ok | err | ext | pending | cfg
const recent = store.get('saf_portal_recent',{});

const t = (k,vars) => { let s=(T[lang]&&T[lang][k])||T.fr[k]||k; if(vars) for(const v in vars) s=s.replace('{'+v+'}',vars[v]); return s; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1) return t('ago_now');
  if(m<60) return t('ago_m',{n:m});
  const h=Math.round(m/60); if(h<48) return t('ago_h',{n:h});
  return t('ago_d',{n:Math.round(h/24)});
}

/* ---------- thème ---------- */
function applyTheme(){
  const sys = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark';
  document.documentElement.setAttribute('data-theme', theme || sys);
}

/* ---------- langue ---------- */
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.getElementById('btn-lang').textContent = lang==='fr'?'EN':'FR';
  renderWho(); render();
}

/* ---------- session Supabase du SMS (lecture locale uniquement) ---------- */
function renderWho(){
  const box=document.getElementById('who'), txt=document.getElementById('who-txt');
  let s=null;
  try{ s=JSON.parse(localStorage.getItem('sb-'+SAF_SUPABASE_REF+'-auth-token')||'null'); }catch(e){}
  const email = s && (s.user?.email || s.currentSession?.user?.email);
  const exp   = s && (s.expires_at || s.currentSession?.expires_at);
  box.classList.remove('on');
  if(!email){ txt.textContent=t('anon'); box.title=''; return; }
  if(exp && exp*1000 < Date.now()){ txt.textContent=t('expired'); box.title=email; return; }
  box.classList.add('on'); txt.textContent=email; box.title=t('session')+' : '+email;
}

/* ---------- état de chaque système ---------- */
async function check(sys){
  if(!sys.url){ health[sys.id]='cfg'; return; }
  health[sys.id]='pending'; render();
  let abs; try{ abs=new URL(sys.url, location.href); }catch(e){ health[sys.id]='err'; render(); return; }
  const same = abs.origin===location.origin;
  const ctrl = new AbortController(); const to=setTimeout(()=>ctrl.abort(),6000);
  try{
    const r = await fetch(abs.href,{method:'HEAD',cache:'no-store',mode:same?'same-origin':'no-cors',signal:ctrl.signal});
    health[sys.id] = same ? (r.ok?'ok':'err') : 'ext';
  }catch(e){ health[sys.id] = location.protocol==='file:' ? 'ext' : 'err'; }
  clearTimeout(to); render();
}

/* ---------- rendu ---------- */
function card(s){
  const st = health[s.id] || (s.url?'pending':'cfg');
  const label = {ok:t('s_ok'),err:t('s_err'),pending:t('s_pending'),cfg:t('s_cfg'),ext:t('s_ext')}[st];
  const path = s.url ? s.url.replace(/^https?:\/\//,'') : t('notcfg');
  const last = recent[s.id] ? t('opened')+' '+ago(recent[s.id]) : t('never');
  const inner = `
    <div class="sys-top">
      <span class="sys-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[s.icon]||ICONS.shield}</svg></span>
      <div><p class="sys-name">${esc(s.name[lang]||s.name.fr)}</p><p class="sys-path">${esc(path)}</p></div>
    </div>
    <p class="sys-desc">${esc(s.desc[lang]||s.desc.fr)}</p>
    <div class="sys-foot"><span class="status" data-s="${st}"><i></i>${label}</span><span>${esc(last)}</span></div>`;
  return s.url
    ? `<a class="sys" style="--c:${s.color}" href="${esc(s.url)}" data-id="${s.id}">${inner}</a>`
    : `<div class="sys" style="--c:${s.color}" aria-disabled="true">${inner}</div>`;
}

function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(!q) return SAF_SYSTEMS;
  return SAF_SYSTEMS.filter(s=>[s.name.fr,s.name.en,s.desc.fr,s.desc.en,s.id].join(' ').toLowerCase().includes(q));
}

function render(){
  const g=document.getElementById('grid'), list=filtered(), q=document.getElementById('q').value.trim();
  g.className='grid'+(view==='list'?' list':'');
  g.innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${esc(t('empty',{q}))}</div>`;
  document.getElementById('v-grid').setAttribute('aria-pressed',view==='grid');
  document.getElementById('v-list').setAttribute('aria-pressed',view==='list');
}

/* ---------- événements ---------- */
document.getElementById('grid').addEventListener('click',e=>{
  const a=e.target.closest('a.sys'); if(!a) return;
  recent[a.dataset.id]=Date.now(); store.set('saf_portal_recent',recent);
});
document.getElementById('q').addEventListener('input',render);
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ const one=filtered().filter(s=>s.url); if(one.length===1){ recent[one[0].id]=Date.now(); store.set('saf_portal_recent',recent); location.href=one[0].url; } }
  if(e.key==='Escape'){ e.target.value=''; render(); e.target.blur(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); document.getElementById('q').focus(); }
});
document.getElementById('v-grid').onclick=()=>{ view='grid'; store.set('saf_portal_view',view); render(); };
document.getElementById('v-list').onclick=()=>{ view='list'; store.set('saf_portal_view',view); render(); };
document.getElementById('btn-lang').onclick=()=>{ lang=lang==='fr'?'en':'fr'; store.set('saf_portal_lang',lang); applyLang(); };
document.getElementById('btn-theme').onclick=()=>{
  theme = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  store.set('saf_portal_theme',theme); applyTheme();
};
window.addEventListener('storage',e=>{ if(e.key && e.key.startsWith('sb-')) renderWho(); });
window.addEventListener('pageshow',()=>{ renderWho(); render(); });

/* ---------- démarrage ---------- */
applyTheme(); applyLang();
SAF_SYSTEMS.forEach(check);
</script>
</body>
</html>
