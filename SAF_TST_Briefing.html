<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1b2a"><title>SAF — Briefing TST</title>
<style>:root{--bg:#0d1b2a;--panel:#14293f;--line:#3e5b73;--ink:#fff;--muted:#c8d5df;--gold:#e1b64e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:690px;margin:0 auto;padding:19px 16px 60px}a{color:var(--gold)}h1{font-size:clamp(26px,7vw,36px);margin:16px 0 7px}p{line-height:1.5;color:var(--muted)}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.langs{display:flex;gap:5px}button,select,input{font:inherit}button{min-height:48px;cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#29445c;color:white;padding:10px 14px;font-weight:650}button.primary{background:var(--gold);color:#0d1b2a;border-color:var(--gold);width:100%;margin-top:14px}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.langs button{min-height:38px;padding:5px 9px;font-size:13px}.langs button[aria-pressed=true]{background:var(--gold);color:#102236}.notice{padding:13px 14px;border-left:4px solid var(--gold);background:#293747;color:#ffdf96;border-radius:6px;margin:16px 0}.field{display:grid;gap:5px;margin:14px 0}.field label{font-weight:650}input{background:#20394f;color:white;border:1px solid #607a8e;border-radius:8px;padding:12px;width:100%;min-height:48px}.progress{background:#34485a;border-radius:20px;height:9px;overflow:hidden}.progress div{background:var(--gold);height:100%;transition:width .2s}.count{font-size:14px;color:var(--muted);margin:10px 0}.item{display:flex;align-items:flex-start;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;margin:9px 0;min-height:74px;cursor:pointer;line-height:1.4}.item:has(input:checked){border-color:#76b69c;background:#1b3c43}.item input{flex:0 0 27px;width:27px;height:27px;min-height:27px;margin:0;accent-color:#5fb08b}.item b{font-size:14px;color:var(--gold);display:block;margin-bottom:3px}.item span{flex:1}.sign{margin-top:22px}canvas{width:100%;height:190px;display:block;background:white;touch-action:none;border-radius:10px;border:2px solid #879dad}.signed{font-size:13px;color:#b7d4c7}.actions{display:flex;gap:9px}.actions button{flex:1}.small{font-size:13px}#qrbox{background:white;padding:14px;width:min(100%,320px);margin:18px auto;border-radius:10px;text-align:center;color:#102236}#qrbox canvas,#qrbox img{max-width:100%;height:auto;border:0}.hidden{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script></head><body><main>
<div class="bar"><a href="./SAF_App.html" id="back">← SAF Mobile</a><div class="langs" aria-label="Language selection"><button data-lang="fr" aria-pressed="true">FR</button><button data-lang="en" aria-pressed="false">EN</button><button data-lang="it" aria-pressed="false">IT</button><button data-lang="es" aria-pressed="false">ES</button></div></div>
<h1 id="title">Briefing TST</h1><p id="intro"></p><div class="notice" id="notice"></div>
<section id="trainer"><h2 id="trainertitle"></h2><div class="field"><label for="ref" id="reflabel"></label><input id="ref" autocomplete="off" maxlength="120" required></div><button id="makeqr" type="button" class="primary"></button><div id="qrwrap" class="hidden"><div id="qrbox"></div><p id="urltext" class="small"></p><button id="openpreview" type="button"></button></div></section>
<section id="participant" class="hidden"><div class="field"><label for="lastName" id="lastlabel"></label><input id="lastName" autocomplete="family-name" required maxlength="100"></div><div class="field"><label for="firstName" id="firstlabel"></label><input id="firstName" autocomplete="given-name" required maxlength="100"></div><div class="field"><label for="email" id="emaillabel"></label><input id="email" type="email" inputmode="email" autocomplete="email" required maxlength="254"></div><div class="field"><label for="company" id="companylabel"></label><input id="company" autocomplete="organization" required maxlength="140"></div><p id="sessioninfo"></p><div class="count" id="count"></div><div class="progress"><div id="progress"></div></div><div id="checks"></div><section class="sign"><h2 id="sigtitle"></h2><p id="sighint"></p><canvas id="signature" aria-label="Handwritten signature"></canvas><div class="actions"><button type="button" id="clear"></button></div><p class="signed" id="signed"></p></section><button class="primary" type="button" id="submit" disabled></button><p class="small" id="status" role="status"></p></section></main>
<script>
const ITEMS=[["Type de mission","Type of mission","Tipo di missione","Tipo de misión"],["Responsabilité individuelle","Individual responsibility","Responsabilità individuale","Responsabilidad individual"],["Déroulement de l'opération","Sequence of the operation","Sequenza dell'operazione","Secuencia de la operación"],["Terrain / Obstacles","Terrain / Obstacles","Terreno / Ostacoli","Terreno / Obstáculos"],["Dangers / Zone dangereuse","Hazards / Danger area","Pericoli / Area pericolosa","Peligros / Zona peligrosa"],["Comportement autour de l'hélicoptère, y compris les procédures d'urgence","Behavior around the helicopter including emergency procedures","Comportamento intorno all'elicottero, comprese le procedure di emergenza","Comportamiento alrededor del helicóptero, incluidos los procedimientos de emergencia"],["Procédures de chargement et déchargement","Loading and unloading procedures","Procedure di carico e scarico","Procedimientos de carga y descarga"],["Utilisation de la porte en fonctionnement normal et en urgence","Operation of the door in normal and emergency conditions","Uso della porta in condizioni normali e di emergenza","Uso de la puerta en condiciones normales y de emergencia"],["Équipement de communication et signaux manuels","Operation of communication equipment and use of hand signs","Uso dei dispositivi di comunicazione e dei segnali manuali","Uso de los equipos de comunicación y de las señales manuales"],["Précautions lors des atterrissages en pente","Beware of slope landings","Precauzioni durante gli atterraggi in pendenza","Precauciones en los aterrizajes en pendiente"],["Limitations de performance (hélicoptère, équipe)","Restrictions on performance (helicopter, team)","Limitazioni delle prestazioni (elicottero, squadra)","Limitaciones de rendimiento (helicóptero, equipo)"],["Consignes de sécurité, y compris interdiction de fumer près du carburant","Safety instructions including a smoking ban near fuel","Istruzioni di sicurezza, incluso il divieto di fumare vicino al carburante","Instrucciones de seguridad, incluida la prohibición de fumar cerca del combustible"],["Procédures d'urgence, y compris emplacement du matériel de premiers secours","Emergency procedures including location of first aid equipment","Procedure di emergenza, inclusa la posizione del materiale di primo soccorso","Procedimientos de emergencia, incluida la ubicación del material de primeros auxilios"],["Comportement dans l'hélicoptère, y compris procédures d'urgence","Behavior in the helicopter including emergency procedures","Comportamento a bordo dell'elicottero, comprese le procedure di emergenza","Comportamiento en el helicóptero, incluidos los procedimientos de emergencia"],["Rangement des outils et des bagages à main","Stowing of tools and hand luggage","Stivaggio degli attrezzi e del bagaglio a mano","Estiba de herramientas y equipaje de mano"],["Comportement à l'embarquement et au débarquement","Behavior during boarding and disembarking","Comportamento durante l'imbarco e lo sbarco","Comportamiento durante el embarque y desembarque"],["Manipulation des moyens de communication et signaux manuels","Handling of communication equipment and use of hand signals","Gestione degli apparati di comunicazione e uso dei segnali manuali","Manejo de los equipos de comunicación y uso de señales manuales"],["Briefing sur les marchandises dangereuses à bord","Dangerous goods carried onboard — briefing","Briefing sulle merci pericolose trasportate a bordo","Briefing sobre mercancías peligrosas a bordo"],["Utilisation de l'intercommunication","Use of the Intercommunication System","Uso del sistema interfonico","Uso del sistema de intercomunicación"],["Utilisation de la radio TFF66 (80 MHz)","Use of the TFF66 Radio (80 MHz)","Uso della radio TFF66 (80 MHz)","Uso de la radio TFF66 (80 MHz)"],["Utilisation du système de sirène","Use of the siren system","Uso del sistema di sirena","Uso del sistema de sirena"]];
const TEXT={
fr:{intro:"Cochez uniquement les points effectivement abordés par le formateur. Les autres sont considérés comme non abordés.",notice:"Version de prévisualisation : l'envoi à Crew Training n'est pas encore activé. L'export local ne constitue pas une attestation de formation.",trainer:"Espace formateur — générer un QR code",ref:"Référence du briefing / mission",qr:"Générer le QR code",open:"Tester le questionnaire",last:"Nom",first:"Prénom",email:"Adresse e-mail",company:"Société",progress:(n,t)=>n+" / "+t+" points abordés",sig:"Signature manuscrite",hint:"Signez dans le cadre avec votre doigt.",clear:"Effacer la signature",submit:"Exporter le formulaire signé (brouillon)",done:"Brouillon signé téléchargé. Aucun enregistrement dans Crew Training.",wait:"Pour continuer, cochez au moins un point abordé et signez.",session:"Briefing : "},
en:{intro:"Tick only items actually covered by the instructor. Unchecked items were not covered.",notice:"Preview version: submission to Crew Training is not enabled. A local export is not a training certificate.",trainer:"Instructor — generate a QR code",ref:"Briefing / mission reference",qr:"Generate QR code",open:"Test the questionnaire",last:"Last name",first:"First name",email:"Email address",company:"Company",progress:(n,t)=>n+" / "+t+" items covered",sig:"Handwritten signature",hint:"Sign inside the box with your finger.",clear:"Clear signature",submit:"Export signed form (draft)",done:"Signed draft downloaded. Nothing recorded in Crew Training.",wait:"Check at least one covered item and sign to continue.",session:"Briefing: "},
it:{intro:"Selezionare solo i punti effettivamente trattati dall'istruttore. Gli altri risultano non trattati.",notice:"Versione di prova: l'invio a Crew Training non è ancora attivo. L'esportazione locale non costituisce un attestato di formazione.",trainer:"Istruttore — genera un codice QR",ref:"Riferimento briefing / missione",qr:"Genera codice QR",open:"Prova il questionario",last:"Cognome",first:"Nome",email:"Indirizzo e-mail",company:"Società",progress:(n,t)=>n+" / "+t+" punti trattati",sig:"Firma autografa",hint:"Firmare nel riquadro con il dito.",clear:"Cancella firma",submit:"Esporta modulo firmato (bozza)",done:"Bozza firmata scaricata. Nulla registrato in Crew Training.",wait:"Selezionare almeno un punto trattato e firmare.",session:"Briefing: "},
es:{intro:"Marque solo los puntos realmente tratados por el instructor. Los demás constarán como no tratados.",notice:"Versión de prueba: el envío a Crew Training aún no está activo. La exportación local no constituye un certificado de formación.",trainer:"Instructor — generar código QR",ref:"Referencia del briefing / misión",qr:"Generar código QR",open:"Probar el cuestionario",last:"Apellidos",first:"Nombre",email:"Correo electrónico",company:"Empresa",progress:(n,t)=>n+" / "+t+" puntos tratados",sig:"Firma manuscrita",hint:"Firme en el recuadro con el dedo.",clear:"Borrar firma",submit:"Exportar formulario firmado (borrador)",done:"Borrador firmado descargado. No se ha registrado nada en Crew Training.",wait:"Marque al menos un punto tratado y firme.",session:"Briefing: "}};
let lang='fr',drawn=false,strokes=[],current=null;const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search),session=qs.get('session'),ref=qs.get('ref')||'';
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.lang===l)));const t=TEXT[l];$('intro').textContent=t.intro;$('notice').textContent=t.notice;$('trainertitle').textContent=t.trainer;$('reflabel').textContent=t.ref;$('makeqr').textContent=t.qr;$('openpreview').textContent=t.open;$('lastlabel').textContent=t.last;$('firstlabel').textContent=t.first;$('emaillabel').textContent=t.email;$('companylabel').textContent=t.company;$('sigtitle').textContent=t.sig;$('sighint').textContent=t.hint;$('clear').textContent=t.clear;$('submit').textContent=t.submit;$('sessioninfo').textContent=t.session+ref;renderItems();}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function renderItems(){const old=[...document.querySelectorAll('.item input')].map(x=>x.checked);$('checks').replaceChildren();ITEMS.forEach((item,i)=>{const label=document.createElement('label');label.className='item';const inp=document.createElement('input');inp.type='checkbox';inp.checked=!!old[i];const txt=document.createElement('span');const n=document.createElement('b');n.textContent=String(i+1).padStart(2,'0');txt.append(n,document.createTextNode(item[['fr','en','it','es'].indexOf(lang)]));label.append(inp,txt);inp.addEventListener('change',update);$('checks').append(label)});update();}
function update(){const boxes=[...document.querySelectorAll('.item input')],checked=boxes.filter(b=>b.checked).length;$('count').textContent=TEXT[lang].progress(checked,boxes.length);$('progress').style.width=(checked/boxes.length*100)+'%';$('submit').disabled=checked<1||!drawn||!['lastName','firstName','company'].every(id=>$(id).value.trim())||!$('email').validity.valid||!$('email').value.trim();}
['lastName','firstName','email','company'].forEach(id=>$(id).addEventListener('input',update));
const canvas=$('signature'),ctx=canvas.getContext('2d');function fit(){const ratio=devicePixelRatio||1;canvas.width=Math.round(canvas.clientWidth*ratio);canvas.height=Math.round(190*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);paint();}function paint(){ctx.clearRect(0,0,canvas.clientWidth,190);ctx.lineWidth=2.6;ctx.strokeStyle='#14293f';ctx.lineCap='round';ctx.lineJoin='round';strokes.forEach(points=>{if(!points.length)return;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);if(points.length===1)ctx.lineTo(points[0][0]+0.1,points[0][1]+0.1);points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.stroke();});}
function point(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);current=[point(e)];strokes.push(current);drawn=true;paint();update();});canvas.addEventListener('pointermove',e=>{if(!current)return;current.push(point(e));paint();});function finish(){current=null;}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
$('clear').onclick=()=>{strokes=[];drawn=false;paint();update();};window.addEventListener('resize',fit);
function setParticipant(){if(!session)return;$('trainer').classList.add('hidden');$('participant').classList.remove('hidden');}
$('makeqr').onclick=()=>{const name=$('ref').value.trim();if(!name){$('ref').focus();return;}const uuid=crypto.randomUUID?crypto.randomUUID():String(Date.now());const u=new URL(location.href);u.search='';u.searchParams.set('session',uuid);u.searchParams.set('ref',name);const url=u.toString();$('qrwrap').classList.remove('hidden');$('qrbox').replaceChildren();$('urltext').textContent=url;$('openpreview').onclick=()=>location.assign(url);
if(typeof QRCode==='function'){new QRCode($('qrbox'),{text:url,width:270,height:270,correctLevel:QRCode.CorrectLevel.M});}else{$('qrbox').textContent='QR indisponible hors connexion : '+url;}};
$('submit').onclick=()=>{if($('submit').disabled||!session)return;const d={schema_version:'tst-briefing-draft-4',status:'draft_not_submitted',session_reference:ref,session_token:session,participant_last_name:$('lastName').value.trim(),participant_first_name:$('firstName').value.trim(),participant_email:$('email').value.trim(),participant_company:$('company').value.trim(),language:lang,items:ITEMS.map((x,i)=>({index:i+1,label_fr:x[0],covered:document.querySelectorAll('.item input')[i].checked,status:document.querySelectorAll('.item input')[i].checked?'covered':'not_covered'})),signature_png:canvas.toDataURL('image/png'),signed_at:new Date().toISOString()};const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='TST-brouillon-signe-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent=TEXT[lang].done;};
setParticipant();setLang('fr');fit();
</script></body></html>
