<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Forum événement — SAF International</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* SAF International — Forum événement (invités) · 23.11.2026
   Fond bleu ciel clair, texte au contraste maximum (charte de la suite SMS SAF). */
:root{
  --sky:#e4f1fb; --paper:#ffffff; --ink:#0d1f30; --ink2:#34495e; --line:#b9d3e8;
  --navy:#1a2e42; --blue:#1a5fa8; --blue-soft:#d7e8f7; --gold:#a77a00;
  --red:#ff1744; --red-d:#b71c1c; --orange:#ff6d00; --orange-d:#e65100; --green:#00e676; --green-d:#004d1a;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
header.top .in{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:500;opacity:.8;font-size:12px;letter-spacing:0}
.me{margin-left:auto;font-size:13px;text-align:right}
.me b{display:block}
.occ{margin:22px 0 12px}
.occ .ref{font-family:var(--mono);font-size:13px;color:var(--blue);font-weight:600}
.occ h1{font-size:clamp(20px,4.5vw,26px);line-height:1.25;margin:4px 0 0;color:var(--ink)}
.state{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;vertical-align:middle}
.state.open{background:var(--green);color:var(--green-d)}
.state.closed{background:#5b6b7a;color:#fff}
.ctx{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px;padding:14px 16px;white-space:pre-wrap}
.ctx-h{font-weight:700;font-size:13px;color:var(--ink2);margin:0 0 4px}
.notice{font-size:13px;color:var(--ink2);margin:10px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:22px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.wrap,header.top .in{max-width:1180px}}
h2{font-size:17px;margin:0 0 10px;color:var(--navy)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:16px}
.thread{display:flex;flex-direction:column;gap:12px}
.msg{border-radius:8px;padding:10px 13px;background:#f3f8fc;border:1px solid var(--line);max-width:92%}
.msg.mine{align-self:flex-end;background:var(--blue-soft);border-color:#9cc3e6}
.msg.sm{border-left:4px solid var(--navy)}
.msg .who{font-weight:700;font-size:13px}
.msg .who span{font-weight:500;color:var(--ink2)}
.msg .when{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-left:6px;font-weight:500}
.msg .body{white-space:pre-wrap;margin-top:3px;overflow-wrap:anywhere}
.sys{align-self:center;font-size:12.5px;color:var(--ink2);text-align:center;max-width:95%}
.sys .when{font-family:var(--mono);font-size:11px;margin-left:4px}
.empty{color:var(--ink2);font-size:14px}
.composer{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
textarea,input[type=text],input[type=date],select{width:100%;border:1.5px solid #8fb4d6;border-radius:6px;background:#fff;padding:9px 10px;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--ink2)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;font-size:14px;cursor:pointer}
.actbox{display:none;margin-top:6px;padding:12px;border:1.5px dashed var(--orange);border-radius:6px;background:#fff7f0}
.actbox.on{display:block}
.btns{display:flex;gap:10px;margin-top:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:disabled{opacity:.55;cursor:wait}
.btn.ghost{background:transparent;border:1.5px solid var(--blue);color:var(--blue);padding:8px 14px}
.fb{font-size:13px;font-weight:600}
.fb.err{color:var(--red-d)} .fb.ok{color:#0a6b33}
.acts{display:flex;flex-direction:column;gap:10px}
.act{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff;border-left:6px solid var(--red)}
.act.st-in-progress{border-left-color:var(--orange)} .act.st-closed{border-left-color:var(--green)} .act.st-cancelled{border-left-color:#8a99a8;opacity:.75}
.act .what{font-weight:600}
.act .meta{font-size:12.5px;color:var(--ink2);margin-top:2px}
.act .late{color:var(--red-d);font-weight:700}
.act select{margin-top:8px;padding:6px 8px;font-size:13px;font-weight:700;width:auto}
.pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:4px;padding:2px 8px;margin-top:6px}
.pill.open{background:var(--red);color:#fff} .pill.in-progress{background:var(--orange);color:#fff}
.pill.closed{background:var(--green);color:var(--green-d)} .pill.cancelled{background:#8a99a8;color:#fff}
.members{list-style:none;padding:0;margin:0;font-size:13.5px}
.members li{padding:5px 0;border-bottom:1px solid #e3edf6}
.members li:last-child{border-bottom:0}
.members .r{font-size:11.5px;color:var(--ink2)}
.gate{max-width:560px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px}
.gate h1{font-size:20px;margin:0 0 8px}
@media (prefers-reduced-motion:no-preference){.msg.new{animation:pop .35s ease-out}@keyframes pop{from{background:#fff3c4}}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand">SAF International<small>Forum événement · Occurrence forum</small></div>
  <div class="me" id="me"></div>
</div></header>
<main class="wrap" id="app"><p style="margin-top:40px">Chargement du forum… / Loading…</p></main>

<script>
(function(){
'use strict';
var FN = 'https://qaqehmxoehcvzcojcqkm.supabase.co/functions/v1/saf-forum';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhcWVobXhvZWhjdnpjb2pjcWttIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMDE3NDMsImV4cCI6MjA5NjU3Nzc0M30.NQ8KjmF2E_cygwO5F7bNya7sy7_TkuVIBwYxQR6GR7Q';
var TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
var D = null, seen = {}, busy = false;
var ST = [['open','Ouverte / Open'],['in-progress','En cours / In progress'],['closed','Clôturée / Closed'],['cancelled','Annulée / Cancelled']];
var STL = {}; ST.forEach(function(s){ STL[s[0]] = s[1]; });

function $(id){ return document.getElementById(id); }
function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDT(s){ var d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtD(s){ var m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'.'+m[2]+'.'+m[1] : '—'; }
function today(){ return new Date().toISOString().slice(0,10); }

function call(body){
  body.token = TOKEN;
  return fetch(FN, { method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + ANON, 'apikey':ANON }, body:JSON.stringify(body) })
    .then(function(r){ return r.json().catch(function(){ return { error:'HTTP ' + r.status }; }).then(function(j){ if(!r.ok && !j.error) j.error = 'HTTP ' + r.status; return j; }); });
}
var ERR = {
  invalid_link:'Ce lien n’est plus valide (accès retiré ou lien incomplet). Demandez un nouveau lien au Safety Manager. / This link is no longer valid.',
  thread_closed:'Le forum est clôturé : il reste consultable mais n’accepte plus de message. / The forum is closed.',
  rate_limited:'Trop de messages en une minute — réessayez dans un instant. / Too many messages, try again shortly.',
  empty:'Écrivez un message ou décrivez une action. / Write a message or describe an action.',
  forbidden:'Seul l’auteur ou le responsable de l’action peut en changer le statut. / Only the author or owner can change this action.'
};
function errText(e){ return ERR[e] || ('Erreur / Error : ' + e); }

function gate(msg){
  $('app').innerHTML = '<div class="gate"><h1>Accès au forum / Forum access</h1><p>' + esc(msg) + '</p><p style="font-size:13px;color:#34495e">Le forum d’un événement n’est accessible que par le lien personnel envoyé par e-mail par le Safety Manager de SAF International.</p></div>';
}

function load(first){
  if(!TOKEN){ gate('Lien incomplet : le jeton d’accès manque. / Incomplete link.'); return; }
  call({ op:'get' }).then(function(j){
    if(j.error){ gate(errText(j.error)); return; }
    var keepDraft = first ? null : snapshotDraft();
    D = j; render(first); if(keepDraft) restoreDraft(keepDraft);
  }).catch(function(){ if(first) gate('Connexion impossible — vérifiez votre réseau et rechargez la page. / Network error.'); });
}

function snapshotDraft(){
  var o = {}; ['f-body','f-what','f-owner','f-due'].forEach(function(id){ var e = $(id); if(e) o[id] = e.value; });
  var t = $('f-act'); o.act = t ? t.checked : false; return o;
}
function restoreDraft(o){
  Object.keys(o).forEach(function(id){ var e = $(id); if(e && id !== 'act') e.value = o[id]; });
  var t = $('f-act'); if(t){ t.checked = o.act; $('actbox').classList.toggle('on', o.act); }
}

function render(first){
  var t = D.thread, me = D.me, open = t.status === 'open';
  $('me').innerHTML = '<b>' + esc(me.name) + '</b>' + esc(me.fn || '');
  document.title = 'Forum ' + t.occ_id + ' — SAF International';
  var memName = {}; D.members.forEach(function(m){ memName[m.id] = m; });

  var posts = D.posts.map(function(p){
    var isNew = !first && !seen[p.id]; seen[p.id] = 1;
    if(p.kind === 'system') return '<div class="sys">' + esc(p.body) + '<span class="when">' + esc(fmtDT(p.created_at)) + '</span></div>';
    var mine = p.member_id === me.id, m = memName[p.member_id];
    return '<div class="msg' + (mine ? ' mine' : '') + (p.author_role === 'sm' ? ' sm' : '') + (isNew ? ' new' : '') + '">'
      + '<div class="who">' + esc(p.author_name) + (p.author_role === 'sm' ? ' <span>· Safety Manager</span>' : (m && m.fn ? ' <span>· ' + esc(m.fn) + '</span>' : '')) + '<span class="when">' + esc(fmtDT(p.created_at)) + '</span></div>'
      + '<div class="body">' + esc(p.body) + '</div></div>';
  }).join('');

  var acts = D.actions.map(function(a){
    var canEdit = open && (a.created_by_member === me.id || a.owner_member_id === me.id);
    var late = (a.status === 'open' || a.status === 'in-progress') && a.due && a.due < today();
    return '<div class="act st-' + esc(a.status) + '"><div class="what">' + esc(a.what) + '</div>'
      + '<div class="meta">Responsable / Owner : ' + esc(a.owner_name || '—') + ' · Échéance / Due : <span class="' + (late ? 'late' : '') + '">' + esc(fmtD(a.due)) + (late ? ' (en retard)' : '') + '</span><br>Proposée par ' + esc(a.created_by_name || '—') + '</div>'
      + (canEdit ? '<select aria-label="Statut de l’action" data-act="' + a.id + '">' + ST.map(function(s){ return '<option value="' + s[0] + '"' + (s[0] === a.status ? ' selected' : '') + '>' + s[1] + '</option>'; }).join('') + '</select>'
                 : '<span class="pill ' + esc(a.status) + '">' + esc(STL[a.status] || a.status) + '</span>')
      + '</div>';
  }).join('');

  var owners = '<option value="">— Non désigné / Not assigned —</option>' + D.members.map(function(m){ return '<option value="' + esc(m.id) + '">' + esc(m.name) + (m.fn ? ' — ' + esc(m.fn) : '') + '</option>'; }).join('');

  $('app').innerHTML =
    '<section class="occ"><div class="ref">' + esc(t.occ_id) + '</div><h1>' + esc(t.title || 'Événement') + '<span class="state ' + (open ? 'open' : 'closed') + '">' + (open ? 'Ouvert' : 'Clôturé') + '</span></h1></section>'
    + (t.context ? '<div class="ctx"><p class="ctx-h">Contexte transmis par le Safety Manager / Context</p>' + esc(t.context) + '</div>' : '')
    + '<p class="notice">Les échanges sont confidentiels et servent uniquement à l’analyse sécurité de l’événement (culture juste). Chaque nouveau message est envoyé par e-mail aux autres participants.</p>'
    + '<div class="grid"><section><h2>Discussion</h2><div class="panel"><div class="thread" id="thread">' + (posts || '<p class="empty">Aucun message pour l’instant. Partagez votre analyse de l’événement ci-dessous.</p>') + '</div>'
    + (open ? '<div class="composer">'
        + '<label class="f" for="f-body">Votre message / Your message</label><textarea id="f-body" maxlength="8000" placeholder="Ce que vous avez constaté, les facteurs contributifs, vos propositions…"></textarea>'
        + '<label class="toggle"><input type="checkbox" id="f-act"> Proposer une action / Propose an action</label>'
        + '<div class="actbox" id="actbox"><label class="f" for="f-what">Action</label><input type="text" id="f-what" maxlength="1000" placeholder="Ex. : rappeler la check-list élingue au briefing équipage">'
        + '<div class="row"><div><label class="f" for="f-owner">Responsable / Owner</label><select id="f-owner">' + owners + '</select></div>'
        + '<div><label class="f" for="f-due">Échéance / Due date</label><input type="date" id="f-due"></div></div></div>'
        + '<div class="btns"><button class="btn primary" id="f-send">Envoyer / Send</button><span class="fb" id="fb" role="status"></span></div></div>'
      : '<p class="notice" style="margin-top:14px"><b>Forum clôturé</b> — consultation seule. / Forum closed — read only.</p>')
    + '</div></section>'
    + '<aside><h2>Actions (' + D.actions.length + ')</h2><div class="panel"><div class="acts">' + (acts || '<p class="empty">Aucune action proposée.</p>') + '</div></div>'
    + '<h2 style="margin-top:20px">Participants (' + D.members.length + ')</h2><div class="panel"><ul class="members">' + D.members.map(function(m){ return '<li>' + esc(m.name) + (m.id === me.id ? ' (vous)' : '') + '<div class="r">' + (m.role === 'sm' ? 'Safety Management' : esc(m.fn || 'Invité')) + '</div></li>'; }).join('') + '</ul></div>'
    + '<p class="notice"><button class="btn ghost" id="f-refresh">Actualiser / Refresh</button></p></aside></div>';

  if(first){ D.posts.forEach(function(p){ seen[p.id] = 1; }); }
  var tg = $('f-act'); if(tg) tg.addEventListener('change', function(){ $('actbox').classList.toggle('on', tg.checked); });
  var sb = $('f-send'); if(sb) sb.addEventListener('click', send);
  $('f-refresh').addEventListener('click', function(){ load(false); });
  document.querySelectorAll('select[data-act]').forEach(function(s){
    s.addEventListener('change', function(){
      var id = +s.getAttribute('data-act'); s.disabled = true;
      call({ op:'action', action_id:id, status:s.value }).then(function(j){ if(j.error) alert(errText(j.error)); load(false); });
    });
  });
}

function send(){
  if(busy) return;
  var body = $('f-body').value.trim(), withAct = $('f-act').checked, what = withAct ? $('f-what').value.trim() : '';
  var fb = $('fb'); fb.className = 'fb'; fb.textContent = '';
  if(!body && !what){ fb.className = 'fb err'; fb.textContent = errText('empty'); return; }
  if(withAct && !what){ fb.className = 'fb err'; fb.textContent = 'Décrivez l’action ou décochez « Proposer une action ».'; return; }
  var payload = { op:'post', body:body };
  if(what) payload.action = { what:what, owner_member_id:$('f-owner').value || null, due:$('f-due').value || null };
  busy = true; $('f-send').disabled = true; fb.textContent = 'Envoi… / Sending…';
  call(payload).then(function(j){
    busy = false;
    if(j.error){ $('f-send').disabled = false; fb.className = 'fb err'; fb.textContent = errText(j.error); return; }
    $('f-body').value = ''; if($('f-what')) $('f-what').value = ''; if($('f-due')) $('f-due').value = '';
    var nb = (j.mails || []).filter(function(m){ return m.ok; }).length, ko = (j.mails || []).length - nb;
    load(false);
    setTimeout(function(){ var f = $('fb'); if(f){ f.className = ko ? 'fb err' : 'fb ok'; f.textContent = 'Message publié' + (nb ? ' — ' + nb + ' participant(s) prévenu(s) par e-mail' : '') + (ko ? ' — ' + ko + ' e-mail(s) non parti(s)' : '') + '.'; } }, 600);
  }).catch(function(){ busy = false; $('f-send').disabled = false; fb.className = 'fb err'; fb.textContent = 'Connexion impossible — le message n’est pas parti. / Network error, not sent.'; });
}

load(true);
setInterval(function(){
  var ae = document.activeElement, typing = ae && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName);
  var draft = ($('f-body') && $('f-body').value.trim()) || ($('f-what') && $('f-what').value.trim());
  if(!document.hidden && D && !busy && !typing && !draft) load(false);
}, 45000);
})();
</script>
</body>
</html>
